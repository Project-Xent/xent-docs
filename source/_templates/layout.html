{%- extends "!layout.html" %}

{%- block body_tag %}
<body class="sepia">
<script>
  (function () {
    var key = "sphinx-library-mode";
    var dark = window.matchMedia("(prefers-color-scheme: dark)");
    function stored() {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function apply() {
      document.body.className = stored() || (dark.matches ? "dark" : "sepia");
    }
    window.toggleMode = function (theme) {
      try {
        if (theme) localStorage.setItem(key, theme);
        else localStorage.removeItem(key);
      } catch (e) {}
      apply();
    };
    dark.addEventListener("change", apply);
    apply();
  })();
</script>
{%- endblock %}
